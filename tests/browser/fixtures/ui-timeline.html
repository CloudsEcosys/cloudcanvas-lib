<!DOCTYPE html>
<!-- Written by Richard Christopher, Copyright 2026 NeoTec, LLC -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <style>
    body { margin: 0; padding: 8px; background: #0f1117; font-family: sans-serif; color: #e2e8f0; }
  </style>
</head>
<body>
  <section id="timeline-host"></section>
  <script type="module">
    import * as ui from '../../../ui/index.js';

    const log = window.log = [];
    // What a host's long-press timer starts from: the item a press lands on, by the id the kit gives it.
    const pressed = window.pressed = [];
    document.addEventListener('pointerdown', (event) => pressed.push(ui.itemIdOf(event.target)));
    const windows = window.windows = [];
    window.ui = ui;
    const NOW = '2026-09-29T08:00';
    const scale = new URLSearchParams(location.search).get('scale') ?? 'week';
    const day = (text) => new Date(`${text}T00:00`);
    const items = [
      { id: 'draft', title: 'Draft', start: day('2026-09-28'), end: day('2026-10-02'), group: { id: 'book', label: 'Writing' } },
      { id: 'quick', title: 'Call the printer', start: new Date('2026-10-02T09:00'), end: new Date('2026-10-02T09:30'), group: { id: 'book', label: 'Writing' } },
      { id: 'day', title: 'Proof the cover', start: day('2026-10-04'), end: day('2026-10-05'), group: { id: 'book', label: 'Writing' } },
      { id: 'five', title: 'Review the layout', start: new Date('2026-10-05T09:00'), end: new Date('2026-10-05T14:00'), group: { id: 'book', label: 'Writing' } },
      { id: 'ship', title: 'Ship', start: day('2026-10-06'), group: 'Release' },
      { id: 'hidden', title: 'Hidden child', start: day('2026-10-03'), end: day('2026-10-05'), group: { id: 'folded', label: 'Folded parent', collapsed: true } }
    ];
    const timeline = ui.createTimeline(document.getElementById('timeline-host'), {
      // What a press says beyond its item (a folded group's summary bar) follows the id, so the log tells the bar from the heading.
      onActivate: (id, ...via) => log.push(['open', id, ...via]),
      onMenu: (id, point, ...via) => log.push(['menu', id, ...via]),
      onLink: (from, to) => log.push(['link', from, to]),
      onChange: (id, times) => log.push(['change', id, times.start.toISOString(), times.end?.toISOString() ?? null]),
      onCreate: ({ groupId, start, end }) => log.push(['create', groupId, ui.dayKey(start), ui.dayKey(end)]),
      onToggleGroup: () => {},
      onWindow: ({ from, to }) => windows.push([from, to])
    });
    // What a case that brings an item into view, or draws more of them, asks of the timeline again.
    window.timeline = timeline;
    window.model = { scale, now: NOW, items, locale: 'en-US', selectedId: 'draft' };
    timeline.update(window.model);
    window.ready = true;
  </script>
</body>
</html>
