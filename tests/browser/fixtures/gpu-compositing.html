<!DOCTYPE html>
<!-- Written by Richard Christopher, Copyright 2026 NeoTec, LLC -->
<!--
  Compositing on a real GPU (`?backend=...&layer=over|under`): a red gpu blit under everything, a DOM card that
  punches a hole in an `over` canvas, a DOM and a gpu blit at the same raised z under a perspective camera, and a
  card whose HTML is drawn through the GPU where HTML-in-Canvas exists.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudCanvas - gpu compositing fixture</title>
  <style>
    body { margin: 0; }
    #app { position: absolute; inset: 0; }
    #card { background: #0000ff; }
    #raised-dom { background: #00ff00; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { blit } from 'cloudcanvas';
    import { stateOf } from 'cloudcanvas/kernel';
    import { schedule } from 'cloudcanvas/kernel';
    import { gpu, punch } from '../../../plugins/gpu.js';
    import { htmlCanvas } from '../../../plugins/html-canvas.js';

    blit.use({ punch });
    const params = new URLSearchParams(location.search);
    const app = blit('#app');
    const controller = gpu(app, { backend: params.get('backend') || 'auto', layer: params.get('layer') || 'over' });
    app.blit({ id: 'floor', x: 0, y: 0, w: 600, h: 400, port: 'gpu', tint: '#ff0000' });
    app.blit({ id: 'card', x: 40, y: 40, w: 100, h: 60, z: 1, punch: true });
    app.blit({ id: 'raised-dom', x: 300, y: 100, w: 40, h: 40, z: 120 });
    app.blit({ id: 'raised-gpu', x: 360, y: 100, w: 40, h: 40, z: 120, port: 'gpu', tint: '#ffff00' });
    const html = app.blit({ id: 'html', x: 40, y: 200, w: 100, h: 60, z: 2, port: 'gpu' });
    html.el.innerHTML = '<div style="width:100%;height:100%;background:#00ffff"><input id="field" value="typed"></div>';
    const drawn = htmlCanvas(html);

    const root = stateOf(app.el).root;
    window.__compositing = {
      ready: controller.ready.then((kind) => kind, (error) => `error: ${error.message}`),
      htmlDrawn: Boolean(drawn),
      /** Content and a child blit interleaved; after `htmlCanvas` and `off()`, the order read back. */
      roundTrip() {
        const card = app.blit({ x: 400, y: 300, w: 60, h: 40, port: 'gpu' });
        card.el.append('before');
        card.blit({ id: 'kid', x: 0, y: 0, w: 5, h: 5 });
        card.el.append('after');
        const order = () => Array.from(card.el.childNodes, (node) => node.id || node.textContent);
        const was = order();
        htmlCanvas(card)();
        return { was, now: order() };
      },
      tilt(fields) { Object.assign(root.camera, fields); schedule(root); },
      project: (x, y, z) => root.camera.project(x, y, root.hostRect, z),
      async pixels(points) {
        const { width, data } = await controller.snapshot();
        return points.map(([x, y]) => {
          const at = (Math.round(y) * width + Math.round(x)) * 4;
          return Array.from(data.slice(at, at + 4));
        });
      }
    };
  </script>
</body>
</html>
