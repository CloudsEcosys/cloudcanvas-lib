<!DOCTYPE html>
<!-- Written by Richard Christopher, Copyright 2026 NeoTec, LLC -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Views under a finger</title>
  <style>
    body { margin: 0; padding: 8px; background: #0f1117; font-family: sans-serif; color: #e2e8f0; }
    section { margin-bottom: 24px; }
  </style>
</head>
<body>
  <!--
    Every view the kit draws that a finger can press - the graph, the timeline, the calendar (month, week) and the tree - with
    every callback given, so every control is drawn: the fold pills, the link handles, the resize handles, the gutter handle,
    the toolbars, the chips. The page has its own scroll; `window.show(id)` brings a section to the top, where a pointer finds it.
    `?calendar=week` draws the calendar as a week, `?scale=day` the timeline by the day.
  -->
  <section id="graph-host"></section>
  <section id="timeline-host"></section>
  <section id="calendar-host"></section>
  <section id="tree-host"></section>
  <script type="module">
    import * as ui from '../../../ui/index.js';

    const log = window.log = [];
    window.ui = ui;
    const query = new URLSearchParams(location.search);
    const NOW = '2026-09-29T08:00';
    const day = (text) => new Date(`${text}T00:00`);
    const note = (name) => (...args) => log.push([name, ...args.map((arg) => (typeof arg === 'string' ? arg : null))]);

    const parent = (from, to) => ({ from, to, kind: 'parent' });
    const graph = ui.createGraph(document.getElementById('graph-host'), {
      onActivate: note('open'), onToggle: note('toggle'), onDropOn: note('drop-on'), onConnect: note('link'), onAdd: note('add'), onDelete: note('delete')
    });
    const graphModel = {
      label: 'Plan', selectedId: 'plan', nodes: [{ id: 'plan', label: 'Plan the launch', childCount: 3 }, { id: 'build', label: 'Build', status: 'Doing', childCount: 1 },
        { id: 'test', label: 'Test' }, { id: 'ship', label: 'Ship' }, { id: 'docs', label: 'Docs' }],
      edges: [parent('plan', 'build'), parent('plan', 'test'), parent('plan', 'ship'), parent('build', 'docs')]
    };
    /** The graph drawn at `scale`, as a host that restores a saved view does. */
    window.zoomGraph = (scale, selectedId = 'plan') => graph.update({ ...graphModel, selectedId, viewport: { x: 16, y: 20, scale } });
    window.zoomGraph(1);

    const book = { id: 'book', label: 'Writing' };
    const items = [
      { id: 'draft', title: 'Draft', start: day('2026-09-28'), end: day('2026-10-02'), group: book },
      { id: 'quick', title: 'Call the printer', start: new Date('2026-10-02T09:00'), end: new Date('2026-10-02T09:30'), group: book },
      { id: 'day', title: 'Proof the cover', start: day('2026-10-04'), end: day('2026-10-05'), group: book },
      { id: 'long', title: 'Write the second part', start: day('2026-10-06'), end: day('2026-10-16'), group: book },
      { id: 'ship', title: 'Ship', start: day('2026-10-06'), group: 'Release' },
      // A folded group of one day: its summary bar is narrower than a finger.
      { id: 'kept', title: 'Kept away', start: day('2026-10-03'), end: day('2026-10-04'), group: { id: 'folded', label: 'Folded', collapsed: true } }
    ];
    const timeline = ui.createTimeline(document.getElementById('timeline-host'), {
      onActivate: note('open'), onChange: note('change'), onCreate: note('create'), onLink: note('link'), onUnlink: note('unlink'), onToggleGroup: note('fold'), onGutter: note('gutter')
    });
    window.drawTimeline = (selectedId = 'long') => timeline.update({ scale: query.get('scale') ?? 'week', now: NOW, items, locale: 'en-US', selectedId });
    window.drawTimeline();

    // A busy day (to be folded into "+ more"), a quiet one, an all-day event, and two events that share the hours.
    const events = [
      ...['a', 'b', 'c', 'd', 'e'].map((id, at) => ({ id: `busy-${id}`, title: `Busy ${id}`, start: new Date(2026, 8, 30, 9 + at, 0), end: new Date(2026, 8, 30, 9 + at, 45) })),
      { id: 'call', title: 'Call', start: new Date('2026-09-29T09:00'), end: new Date('2026-09-29T10:00') },
      { id: 'sync', title: 'Sync', start: new Date('2026-09-29T14:00'), end: new Date('2026-09-29T14:15') },
      { id: 'trip', title: 'Trip', start: day('2026-10-02'), allDay: true },
      { id: 'one', title: 'One', start: new Date('2026-10-01T10:00'), end: new Date('2026-10-01T11:30') },
      { id: 'two', title: 'Two', start: new Date('2026-10-01T10:30'), end: new Date('2026-10-01T12:00') }
    ];
    const calendar = ui.createCalendar(document.getElementById('calendar-host'), {
      onNavigate: () => {}, onPick: note('pick'), onActivate: note('open'), onMove: note('move'), onResize: note('resize')
    });
    calendar.update({ view: query.get('calendar') ?? 'month', date: '2026-09-29', now: NOW, events, locale: 'en-US', hours: { start: 6, end: 22 }, selectedId: 'call' });

    ui.createTree(document.getElementById('tree-host')).update({
      label: 'Notebooks', selectedId: 'ship', expanded: ['work'],
      items: [{ id: 'work', label: 'Work', count: 12 }, { id: 'plan', parentId: 'work', label: 'Planning' }, { id: 'ship', parentId: 'work', label: 'Shipping', count: 4 }, { id: 'home', label: 'Home' }]
    });

    /** Bring section `id` to the top of the viewport: a pointer finds nothing that is off screen. */
    window.show = (id) => document.getElementById(id).scrollIntoView({ block: 'start' });
    window.ready = true;
  </script>
</body>
</html>
